services:

  # ============================================================
  # API GATEWAY
  # ============================================================
  gateway:
    build:
      context: ./point-of-sale-gateway
      dockerfile: Dockerfile

    container_name: msc-pos-gateway

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      GATEWAY_PORT: 8080

      AUTH_SERVICE_URL: http://auth-service:8080
      POS_SERVICE_URL: http://pos-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080

    depends_on:
      auth-service:
        condition: service_healthy

      pos-service:
        condition: service_healthy

      inventory-service:
        condition: service_healthy

    networks:
      - pos-network


  # ============================================================
  # AUTH SERVICE
  # ============================================================
  auth-service:
    build:
      context: ./point-of-sale-auth
      dockerfile: Dockerfile

    container_name: msc-pos-auth

    restart: unless-stopped

    expose:
      - "8080"

    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-point_of_sale}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - pos-network


  # ============================================================
  # POS SERVICE
  # ============================================================
  pos-service:
    build:
      context: ./point-of-sale-service
      dockerfile: Dockerfile

    container_name: msc-pos-service

    restart: unless-stopped

    expose:
      - "8080"

    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-point_of_sale}

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - pos-network


  # ============================================================
  # INVENTORY SERVICE
  # ============================================================
  inventory-service:
    build:
      context: ./point-of-sale-inventory
      dockerfile: Dockerfile

    container_name: pos-inventory-service

    restart: unless-stopped

    expose:
      - "8080"

    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-point_of_sale}

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - pos-network


  # ============================================================
  # MYSQL
  # ============================================================
  mysql:
    image: mysql:8.0

    container_name: pos-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-point_of_sale}

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_PASSWORD:-root}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - pos-network


# ==============================================================
# NETWORK
# ==============================================================
networks:

  pos-network:
    name: pos-network
    driver: bridge


# ==============================================================
# VOLUMES
# ==============================================================
volumes:

  mysql-data:
    name: pos-mysql-data