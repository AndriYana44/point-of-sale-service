
services:
  # ============================================================
  # API GATEWAY - HOST PORT 8080
  # Jalankan hanya ketika dibutuhkan dengan profile gateway
  # ============================================================
  gateway:
    profiles:
      - gateway

    build:
      context: ./msc-pos-gateway
      dockerfile: Dockerfile

    container_name: pos-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      GATEWAY_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8080

    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy

    networks:
      - pos-network

  # ============================================================
  # AUTH SERVICE - HOST PORT 8081
  # ============================================================
  auth-service:
    build:
      context: ./msc-pos-auth
      dockerfile: Dockerfile

    container_name: pos-auth-service
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080

      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${AUTH_DB_NAME:-pos_auth}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - pos-network

  # ============================================================
  # PRODUCT SERVICE - HOST PORT 8082
  # ============================================================
  product-service:
    build:
      context: ./msc-pos-product
      dockerfile: Dockerfile

    container_name: pos-product-service
    restart: unless-stopped

    ports:
      - "8082:8080"

    environment:
      APP_ENV: development
      APP_PORT: 8080

      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${PRODUCT_DB_NAME:-pos_products}

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - pos-network

# ============================================================
# NETWORK
# ============================================================
networks:
  pos-network:
    name: pos-network
    driver: bridge
